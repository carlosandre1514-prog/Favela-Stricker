name: APK do jogo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar SDK/NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar o APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: favela-stricker-apk
          path: app/build/outputs/apk/debug/*.apk

  # Motor no Linux (Mesa, sem celular): partida online simulada, para pegar erro antes de ir para o celular
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências (Mesa EGL/GLES)
        run: |
          # a rede do servidor do GitHub às vezes não acha os espelhos do Ubuntu: tenta de novo antes de desistir
          for i in 1 2 3 4; do
            timeout 420 sudo apt-get update -qq -o Acquire::Retries=3 && \
            timeout 420 sudo apt-get install -y -qq -o Acquire::Retries=3 --fix-missing libegl-dev libgles-dev libegl-mesa0 > /dev/null && exit 0
            echo "apt falhou (tentativa $i), esperando 45 s"; sleep 45
          done
          exit 1
      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4 --target favela_testes
      - name: Partida online simulada
        run: |
          mkdir -p saida
          SO_ONLINE=1 ./build/favela_testes shaders saida
      - name: Escada externa (sobe até a laje sem cair)
        run: SO_ESCADA_EXTERNA=1 ./build/favela_testes shaders saida
      - name: Pular janela e câmera sem atravessar parede
        run: SO_JANELA=1 ./build/favela_testes shaders saida
      - name: Memória no nível Leve (o mesmo mapa do APK)
        run: |
          echo 0 > shaders/qualidade.txt
          SO_MEMORIA=app/src/main/assets/exemplos/5_policia_x_bandidos.json ./build/favela_testes shaders saida
